<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child {
            border: 2px solid black;
            margin: 14;
            padding: px;
            background-color: red;
            cursor: pointer;
        }

        .childcontainer {
            margin: 14;
            padding: 14px;
            background-color: blue;
        }

        .container {
            margin: 14;
            padding: 14px;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                im a child meow
            </div>
        </section>
    </div>

    <script>
        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("child was click")
        })

        document.querySelector(".childcontainer").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("childcontainer was click")
        })

        document.querySelector(".container").addEventListener("click", (e) => {
            e.stopPropagation()
            alert("container was click")
        })

        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1}, ${val2}, ${val3})`}

            setInterval(() => {
                document.querySelector(".child").style.backgroundColor = getRandomColor();
            }, 1000);

            setInterval(() => {
                document.querySelector(".childcontainer").style.backgroundColor = getRandomColor();
            }, 1050);

            setInterval(() => {
                document.querySelector(".container").style.backgroundColor = getRandomColor();
            }, 1025);


    </script>

</body>  
</html>
