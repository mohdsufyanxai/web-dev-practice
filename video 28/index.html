<!DOCTYPE html>
<html lang="en">

<head>

        .box4 {

        }

        .perent {
            position: absolute;
            margin: 35px;
            padding: 43px;
            border: 3px solid black;
            filter: invert(1);
        }

</head>

<body>
    <div class="perent">
