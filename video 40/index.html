<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: hotpink;
            height: 50px;
        }

        main {
            background-color: black;
            color: white;
            padding: 50px;
        }

        .container {
            background-color: darkmagenta;
            width: 12px 33px;
            padding: 60px 25px;
            text-align: center;
        }

        .box1 {
            background-color: blue;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }

        .box2 {
            background-color: cyan;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }

        .text-box {
            padding: 34px;
            border: 2px solid white;
            margin: 50px 34vw;
            font-size: 2em;
            border-radius: 13px;
        }

        .ball {
            height: 32px;
            width: 32px;
            background: orange;
            position: fixed;
            bottom: 13px;
            right: 12px;
            border-radius: 60px;
        }

        footer {
            height: 100px;
            /* background-color: deeppink; */
        }
    </style>
</head>

<body>

    <header>
        <nav>

        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="text-box">
            <p>welcome to uwu geems</p>
        </div>
        <div class="ball"></div>
    </main>

    <footer>

    </footer>

</html>
